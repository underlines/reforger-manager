# Local development overrides — Docker Compose merges this on top of
# docker-compose.yml automatically (no -f needed). Portainer does NOT apply it.
#
# vs. the base file:
#
#   1. Networking. The base uses `network_mode: host` so spawned Reforger game
#      servers bind host UDP ports directly. That is unavailable/unreliable on
#      Docker Desktop, so here the manager runs on the default bridge with only
#      the web UI/API port published, and reaches Postgres via
#      host.docker.internal (the db still publishes 127.0.0.1:5432).
#
#      Enough to develop and test the manager itself (UI, API, DB, mod
#      downloads, pre-flight, engine-build tracking, steamcmd install). To run a
#      real LAN-joinable game server, use the base file only:
#          docker compose -f docker-compose.yml up -d
#
#   2. DATABASE_URL points at host.docker.internal (a bridged container has no
#      host loopback).
#
# Persistent data still follows ${DATA_DIR:-./data} from the base file.

services:
  reforger-manager:
    network_mode: bridge
    ports:
      - "${WEB_PORT:-18090}:18090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: 'postgresql+asyncpg://${POSTGRES_USER:-reforger}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@host.docker.internal:5432/${POSTGRES_DB:-reforger_manager}'
