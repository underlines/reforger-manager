name: reforger-manager

# Persistent data lives under ${DATA_DIR} (default ./data): the Reforger install
# (~10 GB), the addon cache (tens of GB) and Postgres. Point DATA_DIR at a roomy
# location in .env for production.

services:
  reforger-manager:
    build: .
    container_name: reforger-manager
    # Host networking: spawned Reforger game servers must bind host UDP ports
    # (2001 game, 17777 A2S, 19999 RCON) and Reforger is sensitive to NAT.
    # docker-compose.override.yml switches this to bridge for local dev.
    network_mode: host
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      reforger-manager-db:
        condition: service_healthy
    volumes:
      - ${DATA_DIR:-./data}/server:/home/steam/data/server
      - ${DATA_DIR:-./data}/mods:/home/steam/data/mods
      - ${DATA_DIR:-./data}/profiles:/home/steam/data/profiles
      - ${DATA_DIR:-./data}/configs:/home/steam/data/configs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18090/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 20

  reforger-manager-db:
    image: postgres:17
    container_name: reforger-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${DATA_DIR:-./data}/pg:/var/lib/postgresql/data
    # Published on loopback only so the host-networked manager reaches it at
    # localhost:5432 without exposing Postgres to the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - reforger-manager-db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 20s
      timeout: 5s
      retries: 10

networks:
  # The db's isolated bridge. The manager is host-networked and does not join it;
  # it talks to the db over the published 127.0.0.1:5432 mapping instead.
  reforger-manager-db-net:
    name: reforger-manager-db-net
    driver: bridge
