name: ${COMPOSE_PROJECT_NAME:-reforger-manager}

# One deployment-shaped compose. Everything environment-specific is a
# ${VARIABLE} with a dev default; supply real values via any of:
#   - a .env file next to this file (docker compose loads it automatically)
#   - the shell environment
#   - Portainer -> Stacks -> <stack> -> Environment variables
# See README.md "Deploying" for the full list.
#
# docker-compose.override.yml (local dev: bridge networking) is merged only by
# the `docker compose` CLI, never by Portainer.
#
# IMPORTANT: set DATA_DIR to an absolute host path with room for tens of GB
# (Reforger engine ~10 GB + addon cache). The ./data default is local-dev only;
# on a server, an unset DATA_DIR would fill the stack's working directory.

services:
  reforger-manager:
    build: .
    container_name: ${COMPOSE_PROJECT_NAME:-reforger-manager}
    # Reforger is NAT-sensitive and spawned game servers bind host UDP ports
    # (2001 game / 17777 A2S / 19999 RCON), so the manager needs host networking
    # on a Linux host. docker-compose.override.yml switches this to bridge for
    # local development on Docker Desktop.
    network_mode: host
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      TZ: ${TZ:-UTC}
      DATABASE_URL: '${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-reforger}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB:-reforger_manager}}'
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-12}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD (bootstraps the admin user once)}
      DB_MIGRATE_ON_STARTUP: ${DB_MIGRATE_ON_STARTUP:-create_all}
      ENGINE_CHECK_ON_STARTUP: ${ENGINE_CHECK_ON_STARTUP:-true}
      NIGHTLY_CHECK_ENABLED: ${NIGHTLY_CHECK_ENABLED:-false}
      NIGHTLY_CHECK_HOUR: ${NIGHTLY_CHECK_HOUR:-3}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173"]}'
    depends_on:
      reforger-manager-db:
        condition: service_healthy
    volumes:
      - ${DATA_DIR:-./data}/server:/home/steam/data/server
      - ${DATA_DIR:-./data}/mods:/home/steam/data/mods
      - ${DATA_DIR:-./data}/profiles:/home/steam/data/profiles
      - ${DATA_DIR:-./data}/configs:/home/steam/data/configs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18090/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 20

  reforger-manager-db:
    image: postgres:${POSTGRES_VERSION:-17}
    container_name: ${COMPOSE_PROJECT_NAME:-reforger-manager}-db
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reforger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-reforger_manager}
    volumes:
      - ${DATA_DIR:-./data}/pg:/var/lib/postgresql/data
    # Loopback-only publish so the host-networked manager reaches it at
    # 127.0.0.1:5432 without exposing Postgres on the LAN.
    ports:
      - "${DB_BIND_ADDR:-127.0.0.1}:${DB_PORT:-5432}:5432"
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 20s
      timeout: 5s
      retries: 10

networks:
  db:
    name: ${COMPOSE_PROJECT_NAME:-reforger-manager}-db-net
    driver: bridge
