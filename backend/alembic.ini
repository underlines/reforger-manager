# Alembic config for Reforger Manager.
#
# The DB URL is intentionally NOT set here; env.py pulls it from the app
# Settings (DATABASE_URL) at runtime. To run the CLI directly:
#   cd backend && alembic upgrade head
# (needs DATABASE_URL exported, or a .env in the working dir)

[alembic]
script_location = app/migrations
prepend_sys_path = .
path_separator = os
# version_locations defaults to <script_location>/versions

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
